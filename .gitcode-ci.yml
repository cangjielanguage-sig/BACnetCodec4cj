# gitcode.com 原生 CI 配置
# 说明：基于 Linux runner + 仓颉工具链。`image` 需替换为 gitcode runner 实际可用的仓颉镜像。

stages:
  - format
  - build
  - test

variables:
  GIT_STRATEGY: clone

# 仓颉工具链镜像 —— 请按 gitcode.com 实际可用镜像替换（例如含 cjc/cjpm/cjfmt/cjlint 的镜像 tag）
image: cangjie:1.1.3

before_script:
  - cjpm --version || true
  - cjc --version || true

# 1. 格式检查：cjfmt 1.1.3 无 check 模式，故输出到独立目录后与源码逐文件比较
format:
  stage: format
  script:
    - cjpm build
    - cjfmt -d src -o target/cjfmt
    - git diff --no-index --exit-code -- src target/cjfmt/src
  artifacts:
    paths:
      - target/cjfmt
    expire_in: 1 week

#2. 构建
build:
  stage: build
  script:
    - cjpm build

#3. 单元测试
test:
  stage: test
  script:
    - cjpm test